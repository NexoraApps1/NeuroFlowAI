<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация | NeuroFlow AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav><h2><a onclick="window.location.href='index.html'"> NeuroFlow AI </a></h2></nav>
</header>

<div class="register-page">
  <div class="register-card">
    <h1>Регистрация</h1>
    <p>Начните 14-дневную бесплатную пробную версию</p>

    <form id="registerForm">
      <input type="text" id="name" placeholder="Имя" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Пароль (мин. 6 символов)" minlength="6" required>
      <button type="submit" id="submitBtn">Зарегистрироваться</button>
    </form>
    <div class="or"><span>или</span></div>
    <button type="button" class="gbtn" id="google"><b style="color:#4285f4;font-size:18px">G</b> Регистрация через Google</button>
    <p id="msg" style="margin-top:16px;margin-bottom:0"></p>

    <span>У вас уже есть аккаунт? <a href="signin.html">Войти</a></span>
  </div>
</div>

<script src="ui.js"></script>
<script type="module">
import { supabase } from './supabase.js';

const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');
document.getElementById('google').onclick = async () => {
  const { error } = await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: new URL('dashboard.html', location.href).href } });
  if (error) { msg.style.color = '#f87171'; msg.textContent = error.message; }
};

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true; msg.style.color = '#94a3b8'; msg.textContent = 'Создаём аккаунт...';

  const fullName = document.getElementById('name').value.trim();
  const emailVal = document.getElementById('email').value.trim();
  const passVal = document.getElementById('password').value;

  const { data, error } = await supabase.auth.signUp({
    email: emailVal,
    password: passVal,
    options: { data: { full_name: fullName } }
  });

  btn.disabled = false;
  if (error) { msg.style.color = '#f87171'; msg.textContent = error.message; return; }

  if (data.session) { location.href = 'dashboard.html'; }   // подтверждение почты выключено
  else { msg.style.color = '#4ade80'; msg.textContent = 'Готово! Проверьте почту и подтвердите email, затем войдите.'; }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | NeuroFlow AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
          <h2><a onclick="window.location.href='index.html'"> NeuroFlow AI </a></h2>
        </nav>
      </header>

<div class="register-page">
    <div class="register-card">
        <h1>Регистрация</h1>
        <p>Начните 14-дневную бесплатную пробную версию</p>

        <form id="registerForm">
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>

            <button type="submit">Зарегистрироваться</button>
        </form>

        <span>У вас уже есть аккаунт?  <a href="login.html">Войти</a></span>
    </div>
</div>


<script>
document.getElementById("registerForm").addEventListener("submit", function(e){
    e.preventDefault();
    alert("Account created successfully!");
    window.location.href = "dashboard.html";
});
</script>

</body>
</html>

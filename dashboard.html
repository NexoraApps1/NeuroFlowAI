<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | NeuroFlow AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="register-page">
  <div class="register-card">
    <h2 id="title">Загрузка...</h2>
    <br>
    <p>Ваше рабочее пространство для ИИ готово.</p>
    <div style="display:flex;flex-direction:column;gap:12px">
      <button id="adminBtn" style="display:none" onclick="location.href='admin.html'">Админ-панель</button>
      <button onclick="location.href='index.html'">На главную</button>
      <button id="logoutBtn">Выйти</button>
    </div>
  </div>
</div>

<script type="module">
import { supabase, getSession } from './supabase.js';

const s = await getSession();
if (!s) { location.href = 'signin.html'; }
else {
  const name = s.profile?.full_name || s.user.email;
  document.getElementById('title').textContent = `Добро пожаловать, ${name} 🚀`;
  if (s.profile?.role === 'admin') document.getElementById('adminBtn').style.display = 'block';
}
document.getElementById('logoutBtn').onclick = async () => {
  await supabase.auth.signOut(); location.href = 'index.html';
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Админ-панель | NeuroFlow AI</title>
<link rel="icon" href="logo-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  .admin{max-width:1000px;margin:0 auto;padding:110px 24px 60px}
  .admin .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .glass{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px;backdrop-filter:blur(18px);margin-top:24px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
  .stats h3{font-size:34px}.stats span{color:#94a3b8}
  .admin input,.admin select{padding:12px;border:none;border-radius:12px;background:rgba(255,255,255,.08);color:white}
  .admin select option{color:black}
  .wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;margin-top:14px}
  th,td{padding:12px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
  th{color:#94a3b8;font-weight:normal}
  .small{padding:10px 18px;background:#6366f1;color:white}
  .bar-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .mchart{display:flex;align-items:stretch;gap:6px;height:170px;margin-top:16px}
  .mchart>div{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;font-size:11px;color:#94a3b8}
  .mchart .bw{flex:1;width:100%;min-height:0;display:flex;align-items:flex-end;margin:4px 0}
  .mchart i{display:block;width:100%;min-height:2px;background:linear-gradient(180deg,#06b6d4,#6366f1);border-radius:6px 6px 0 0}
  .mchart b,.mchart em{font-style:normal;font-weight:normal}
  #login{max-width:420px;margin:0 auto}
  #login input{width:100%;margin-bottom:12px}
</style>
</head>
<body>
<header><nav><a class="logo" href="index.html"><img src="logo.svg" alt="NeuroFlow AI"></a></nav></header>

<div class="admin">
  <div id="login" class="glass">
    <h2>Вход в админ-панель</h2><br>
    <input id="email" type="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Пароль">
    <button id="loginBtn" class="small" style="width:100%">Войти</button>
    <p id="err" style="color:#f87171;margin-top:12px"></p>
  </div>

  <div id="panel" style="display:none">
    <div class="top"><h1>Админ-панель</h1><button id="logout" class="small">Выйти</button></div>

    <div class="glass stats">
      <div><h3 id="cTotal">0</h3><span>Всего пользователей</span></div>
      <div><h3 id="cAdmins">0</h3><span>Администраторов</span></div>
      <div><h3 id="cWeek">0</h3><span>За 7 дней</span></div>
    </div>

    <div class="glass"><h3>Регистрации за 14 дней</h3><div class="mchart" id="chart"></div></div>

    <div class="glass" style="display:flex;gap:10px;padding:14px">
      <button class="small tabb" data-t="usersBox">Пользователи</button>
      <button class="small tabb" data-t="leadsBox" style="background:rgba(255,255,255,.1)">Заявки <span id="cLeads"></span></button>
    </div>
    <div class="glass box" id="usersBox">
      <div class="bar-row">
        <input id="search" placeholder="Поиск по имени или email" style="width:100%;max-width:360px">
        <button class="small" id="expUsers">⬇ Экспорт CSV</button>
      </div>
      <div class="wrap"><table id="users"></table></div>
    </div>
    <div class="glass box" id="leadsBox" style="display:none">
      <button class="small" id="expLeads">⬇ Экспорт CSV</button>
      <div class="wrap"><table id="leads"></table></div>
    </div>
  </div>
</div>

<script src="ui.js"></script>
<script type="module">
import { supabase, getSession } from './supabase.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let all = [], shown = [], leadsData = [], myId = null;

async function init() {
  const s = await getSession();
  if (s?.profile?.role === 'admin') {
    myId = s.user.id;
    $('login').style.display = 'none'; $('panel').style.display = 'block';
    load();
  } else {
    $('panel').style.display = 'none'; $('login').style.display = 'block';
    if (s) $('err').textContent = 'У этого аккаунта нет прав администратора';
  }
}

async function load() {
  const { data, error } = await supabase.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) { alert(error.message); return; }
  all = data; render(); loadLeads();
}

function render() {
  const q = $('search').value.toLowerCase();
  const list = all.filter(u => (u.email || '').toLowerCase().includes(q) || (u.full_name || '').toLowerCase().includes(q));
  $('cTotal').textContent = all.length;
  $('cAdmins').textContent = all.filter(u => u.role === 'admin').length;
  $('cWeek').textContent = all.filter(u => Date.now() - new Date(u.created_at) < 7 * 864e5).length;
  shown = list; drawChart();

  $('users').innerHTML = '<tr><th>Дата</th><th>Имя</th><th>Email</th><th>Роль</th><th>Доступ</th></tr>' +
    list.map(u => `<tr>
      <td>${new Date(u.created_at).toLocaleDateString('ru-RU')}</td>
      <td>${esc(u.full_name) || '—'}</td>
      <td>${esc(u.email)}</td>
      <td><select data-id="${u.id}" ${u.id === myId ? 'disabled' : ''}>
        <option value="user" ${u.role === 'user' ? 'selected' : ''}>user</option>
        <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option>
      </select></td>
      <td>${u.id === myId ? '—' : `<button class="small" data-block="${u.id}" data-val="${!u.blocked}" style="background:${u.blocked ? '#16a34a' : '#dc2626'}">${u.blocked ? 'Разблокировать' : 'Заблокировать'}</button>`}</td></tr>`).join('');
}

$('users').addEventListener('change', async e => {
  if (e.target.tagName !== 'SELECT') return;
  const { error } = await supabase.from('profiles').update({ role: e.target.value }).eq('id', e.target.dataset.id);
  if (error) alert(error.message);
  load();
});
$('search').addEventListener('input', render);

$('loginBtn').onclick = async () => {
  const { error } = await supabase.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  if (error) { $('err').textContent = error.message; return; }
  $('err').textContent = ''; init();
};
$('logout').onclick = async () => { await supabase.auth.signOut(); init(); };

$('users').addEventListener('click', async e => {
  const b = e.target.closest('[data-block]'); if (!b) return;
  const block = b.dataset.val === 'true';
  if (block && !confirm('Заблокировать пользователя?')) return;
  const { error } = await supabase.from('profiles').update({ blocked: block }).eq('id', b.dataset.block);
  if (error) alert(error.message);
  load();
});

const LBL = { new: 'Новая', in_progress: 'В работе', done: 'Готово' };
async function loadLeads() {
  const { data, error } = await supabase.from('leads').select('*').order('created_at', { ascending: false });
  if (error) return;
  leadsData = data;
  const fresh = data.filter(l => l.status === 'new').length;
  $('cLeads').textContent = fresh ? `(${fresh} новых)` : '';
  $('leads').innerHTML = '<tr><th>Дата</th><th>Имя</th><th>Email</th><th>Сообщение</th><th>Статус</th><th></th></tr>' +
    (data.length ? data.map(l => `<tr>
      <td>${new Date(l.created_at).toLocaleString('ru-RU')}</td>
      <td>${esc(l.name)}</td><td>${esc(l.email)}</td><td>${esc(l.message)}</td>
      <td><select class="st" data-id="${l.id}">${Object.keys(LBL).map(k => `<option value="${k}" ${k === l.status ? 'selected' : ''}>${LBL[k]}</option>`).join('')}</select></td>
      <td><button class="small del" data-id="${l.id}" style="background:#dc2626">Удалить</button></td></tr>`).join('')
      : '<tr><td colspan="6" style="color:#94a3b8">Заявок пока нет</td></tr>');
}
$('leads').addEventListener('change', async e => {
  if (!e.target.classList.contains('st')) return;
  await supabase.from('leads').update({ status: e.target.value }).eq('id', e.target.dataset.id);
  loadLeads();
});
$('leads').addEventListener('click', async e => {
  if (!e.target.classList.contains('del') || !confirm('Удалить заявку?')) return;
  await supabase.from('leads').delete().eq('id', e.target.dataset.id);
  loadLeads();
});
document.querySelectorAll('.tabb').forEach(b => b.onclick = () => {
  document.querySelectorAll('.box').forEach(x => x.style.display = 'none');
  $(b.dataset.t).style.display = 'block';
  document.querySelectorAll('.tabb').forEach(x => x.style.background = 'rgba(255,255,255,.1)');
  b.style.background = '#6366f1';
});

function drawChart() {
  const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 13 + i); return d; });
  const cnt = days.map(d => all.filter(u => new Date(u.created_at).toDateString() === d.toDateString()).length);
  const mx = Math.max(1, ...cnt);
  $('chart').innerHTML = days.map((d, i) =>
    `<div title="${d.toLocaleDateString('ru-RU')}: ${cnt[i]}"><b>${cnt[i]}</b><span class="bw"><i style="height:${cnt[i] / mx * 100}%"></i></span><em>${d.getDate()}.${String(d.getMonth() + 1).padStart(2, '0')}</em></div>`).join('');
}

// экспорт в CSV (разделитель ; и BOM — корректно открывается в Excel)
function exportCSV(rows, cols, name) {
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const lines = [cols.map(c => cell(c[1])).join(';'), ...rows.map(r => cols.map(c => cell(r[c[0]])).join(';'))];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = `${name}_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('expUsers').onclick = () => exportCSV(shown, [['created_at', 'Дата'], ['full_name', 'Имя'], ['email', 'Email'], ['role', 'Роль'], ['blocked', 'Заблокирован']], 'users');
$('expLeads').onclick = () => exportCSV(leadsData, [['created_at', 'Дата'], ['name', 'Имя'], ['email', 'Email'], ['message', 'Сообщение'], ['status', 'Статус']], 'leads');

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход | NeuroFlow AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav><h2><a onclick="window.location.href='index.html'"> NeuroFlow AI </a></h2></nav>
</header>

<div class="register-page">
  <div class="register-card">
    <h1>Войти</h1>
    <p>Войдите в свой аккаунт, чтобы продолжить работу</p>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Пароль" required>
      <button type="submit" id="submitBtn">Войти</button>
    </form>
    <div class="or"><span>или</span></div>
    <button type="button" class="gbtn" id="google"><b style="color:#4285f4;font-size:18px">G</b> Войти через Google</button>
    <p id="msg" style="margin-top:16px;margin-bottom:0"></p>

    <span style="margin-top:14px"><a href="#" id="forgot">Забыли пароль?</a></span>
    <span>У вас нет аккаунта? <a href="register.html">Зарегистрироваться</a></span>
  </div>
</div>

<script src="ui.js"></script>
<script type="module">
import { supabase } from './supabase.js';

const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');
document.getElementById('google').onclick = async () => {
  const { error } = await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: new URL('dashboard.html', location.href).href } });
  if (error) { msg.style.color = '#f87171'; msg.textContent = error.message; }
};

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true; msg.style.color = '#94a3b8'; msg.textContent = 'Входим...';

  const { error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  });

  btn.disabled = false;
  if (error) { msg.style.color = '#f87171'; msg.textContent = error.message; return; }
  const { data: { user } } = await supabase.auth.getUser();
  const { data: p } = await supabase.from('profiles').select('blocked').eq('id', user.id).single();
  if (p?.blocked) { await supabase.auth.signOut(); msg.style.color = '#f87171'; msg.textContent = 'Аккаунт заблокирован'; return; }
  location.href = 'dashboard.html';
});

document.getElementById('forgot').addEventListener('click', async e => {
  e.preventDefault();
  const em = document.getElementById('email').value.trim();
  if (!em) { msg.style.color = '#f87171'; msg.textContent = 'Введите email в поле выше'; return; }
  const { error } = await supabase.auth.resetPasswordForEmail(em, { redirectTo: new URL('reset.html', location.href).href });
  msg.style.color = error ? '#f87171' : '#4ade80';
  msg.textContent = error ? error.message : 'Письмо со ссылкой для сброса пароля отправлено ✓';
});
</script>
</body>
</html>
